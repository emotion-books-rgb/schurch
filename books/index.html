<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도서신청 | 서대문교회</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 헤더 -->
  <header>
    <div class="header-inner">
      <div class="logo">✝ 서대문교회</div>
      <nav>
        <a href="index.html" class="active">도서 신청</a>
        <a href="status.html">신청 현황</a>
        <a href="../library/">📚 도서관</a>
      </nav>
    </div>
  </header>

  <!-- 메인 -->
  <main>
    <section class="hero">
      <h1>📚 도서 신청</h1>
      <p>읽고 싶은 책을 신청하시면 교회에서 구매해 드립니다.</p>
    </section>

    <section class="form-section">
      <form id="bookForm">

        <div class="form-group">
          <label for="name">신청자 이름 <span class="required">*</span></label>
          <input type="text" id="name" placeholder="홍길동" required>
        </div>

        <div class="form-group">
          <label for="phone">연락처 <span class="required">*</span></label>
          <input type="tel" id="phone" placeholder="010-0000-0000" required>
        </div>

        <div class="form-group">
          <label for="department">소속 부서</label>
          <select id="department">
            <option value="">-- 선택 --</option>
            <option>학생부</option>
            <option>주일학교</option>
            <option>청년부</option>
            <option>장년부</option>
          </select>
        </div>

        <div class="form-group">
          <label for="bookTitle">도서 제목 <span class="required">*</span></label>
          <input type="text" id="bookTitle" placeholder="도서 제목을 입력하세요" required>
        </div>

        <div class="form-group">
          <label for="author">저자</label>
          <input type="text" id="author" placeholder="저자명">
        </div>

        <div class="form-group">
          <label for="publisher">출판사</label>
          <input type="text" id="publisher" placeholder="출판사명">
        </div>

        <div class="form-group">
          <label for="link">구매처 링크</label>
          <input type="url" id="link" placeholder="https://www.yes24.com/...">
          <small>예스24, 알라딘, 교보문고 등 링크를 붙여넣으세요</small>
        </div>

        <div class="form-group">
          <label for="reason">신청 사유</label>
          <textarea id="reason" rows="3" placeholder="이 책을 신청하는 이유를 간단히 적어주세요 (선택)"></textarea>
        </div>

        <button type="submit" id="submitBtn">신청하기</button>
      </form>

      <!-- 완료 메시지 -->
      <div id="successMsg" class="success-msg hidden">
        ✅ 신청이 완료되었습니다! 담당자 확인 후 처리해 드립니다.
        <br><a href="status.html">신청 현황 확인하기 →</a>
      </div>

      <!-- 오류 메시지 -->
      <div id="errorMsg" class="error-msg hidden">
        ❌ 신청 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.
      </div>
    </section>
  </main>

  <footer>
    <p>서대문교회 | 문의: 교회 사무실</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
