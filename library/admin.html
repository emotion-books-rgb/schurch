<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 - 서대문교회 작은도서관 (와우서재)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">📚 와우서재 관리자</div>
      <nav>
        <a href="index.html">도서 목록</a>
        <a href="admin.html" class="active">관리자</a>
        <a href="https://schurch.kr" target="_blank">🏠 서대문교회</a>
      </nav>
    </div>
  </header>

  <div class="hero">
    <h1>와우서재 관리</h1>
    <p>도서 등록, 도서 변경, 대출/반납 처리</p>
  </div>

  <main>
    <!-- 탭 -->
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('tab-loan', this)">대출/반납 처리</button>
      <button class="tab-btn" onclick="showTab('tab-add', this)">도서 등록</button>
      <button class="tab-btn" onclick="showTab('tab-edit', this)">도서 변경</button>
      <button class="tab-btn" onclick="showTab('tab-status', this)">현황</button>
    </div>

    <!-- 대출/반납 탭 -->
    <div id="tab-loan">
      <!-- 대출 신청 목록 -->
      <div class="card">
        <h2>🔔 대출 신청 목록</h2>
        <div id="pendingLoans">
          <div class="loading">불러오는 중...</div>
        </div>
      </div>

      <!-- 대출 중 목록 -->
      <div class="card">
        <h2>📤 현재 대출 중</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>청구기호</th>
                <th>도서명</th>
                <th>대출자</th>
                <th>연락처</th>
                <th>대출일</th>
                <th>반납 예정</th>
                <th>처리</th>
              </tr>
            </thead>
            <tbody id="activeLoansAdmin">
              <tr><td colspan="7" class="loading">불러오는 중...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 도서 등록 탭 -->
    <div id="tab-add" class="hidden">
      <div class="card">
        <h2>📗 새 도서 등록</h2>
        <div class="form-section">
          <div class="form-row">
            <div class="form-group">
              <label>분류 <span class="required">*</span></label>
              <select id="bookCat" onchange="onCatChange()">
                <option value="">선택</option>
              </select>
            </div>
            <div class="form-group">
              <label>저자 첫 성 <span class="required">*</span></label>
              <input type="text" id="bookAuthorCode" placeholder="예: 김" maxlength="1" oninput="updateCallNum()">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>일련번호 <span class="required">*</span></label>
              <input type="text" id="bookSerial" placeholder="001" maxlength="3" oninput="updateCallNum()">
            </div>
            <div class="form-group">
              <label>청구기호 (자동생성) <span style="font-size:0.8rem;color:#888;">분류/번호/성</span></label>
              <input type="text" id="bookCallNum" readonly style="background:#f5f5f5; font-family:monospace;">
            </div>
          </div>
          <div class="form-group">
            <label>도서명 <span class="required">*</span></label>
            <input type="text" id="bookTitle" placeholder="도서명을 입력하세요">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>저자 <span class="required">*</span></label>
              <input type="text" id="bookAuthor" placeholder="홍길동">
            </div>
            <div class="form-group">
              <label>출판사</label>
              <input type="text" id="bookPublisher">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>출판연도</label>
              <input type="text" id="bookYear" placeholder="2024">
            </div>
            <div class="form-group">
              <label>구입일</label>
              <input type="date" id="bookBuyDate">
            </div>
          </div>
          <div class="form-group">
            <label>메모</label>
            <input type="text" id="bookMemo" placeholder="기증자, 특이사항 등">
          </div>
          <div id="addBookMsg"></div>
          <button class="btn btn-primary" onclick="addBook()" id="addBookBtn">도서 등록</button>
        </div>
      </div>
    </div>

    <!-- 도서 변경 탭 -->
    <div id="tab-edit" class="hidden">
      <div class="card">
        <h2>✏️ 도서 정보 변경</h2>
        <div class="form-section">
          <!-- 도서 검색 -->
          <div class="form-row" style="align-items:flex-end;">
            <div class="form-group" style="flex:2;">
              <label>청구기호 또는 도서명으로 검색</label>
              <input type="text" id="editSearch" placeholder="예: A/001/김 또는 도서명 입력" oninput="searchEditBook()">
            </div>
          </div>
          <!-- 검색 결과 -->
          <div id="editSearchResult" style="margin:8px 0 16px;"></div>

          <!-- 수정 폼 (도서 선택 후 표시) -->
          <div id="editForm" style="display:none;">
            <div style="background:#e8f4e8;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:0.9rem;">
              선택된 도서: <strong id="editSelectedCallNum"></strong> — <span id="editSelectedTitle"></span>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>청구기호 <span style="font-size:0.8rem;color:#e07000;">⚠ 변경 시 기존 대출 기록과 불일치 주의</span></label>
                <input type="text" id="editCallNum" placeholder="예: A/001/김" style="font-family:monospace;">
              </div>
              <div class="form-group">
                <label>도서명</label>
                <input type="text" id="editTitle">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>저자</label>
                <input type="text" id="editAuthor">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>출판사</label>
                <input type="text" id="editPublisher">
              </div>
              <div class="form-group">
                <label>출판연도</label>
                <input type="text" id="editYear">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>분류</label>
                <select id="editCat">
                  <option value="">선택</option>
                </select>
              </div>
              <div class="form-group">
                <label>상태</label>
                <select id="editStatus">
                  <option value="대출가능">대출가능</option>
                  <option value="대출중">대출중</option>
                  <option value="분실">분실</option>
                  <option value="폐기">폐기</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>메모</label>
              <input type="text" id="editMemo" placeholder="기증자, 특이사항 등">
            </div>
            <div id="editBookMsg"></div>
            <button class="btn btn-primary" onclick="updateBook()" id="editBookBtn">변경 저장</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 현황 탭 -->
    <div id="tab-status" class="hidden">
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-num" id="sTotalBooks">-</div>
          <div class="stat-label">전체 도서</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="sAvailable">-</div>
          <div class="stat-label">대출 가능</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="sLoaned">-</div>
          <div class="stat-label">대출 중</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="sOverdue">-</div>
          <div class="stat-label">연체</div>
        </div>
      </div>

      <div class="card">
        <h2>전체 도서 목록</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>청구기호</th>
                <th>도서명</th>
                <th>저자</th>
                <th>분류</th>
                <th>상태</th>
                <th>등록일</th>
              </tr>
            </thead>
            <tbody id="allBooksAdmin">
              <tr><td colspan="6" class="loading">불러오는 중...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>서대문교회 작은도서관 (와우서재) 관리자 페이지</p>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    // 분류 옵션 채우기
    CONFIG.CATEGORIES.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.code;
      opt.textContent = `${c.code} - ${c.name}`;
      document.getElementById('bookCat').appendChild(opt);
    });
    // 초기 로드
    loadAdminData();
  </script>
</body>
</html>
