<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>와우서재 - 서대문교회 작은도서관</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">📚 서대문교회 작은도서관 (와우서재)</div>
      <nav>
        <a href="index.html" class="active">도서 목록</a>
        <a href="mybooks.html">내 대출현황</a>
        <a href="../books/index.html">도서 신청</a>
        <a href="https://schurch.kr" target="_blank">🏠 서대문교회</a>
      </nav>
    </div>
  </header>

  <div class="hero">
    <h1>서대문교회 작은도서관 (와우서재)</h1>
    <p>신앙의 깊이를 더하는 책들을 만나보세요</p>
  </div>

  <main>
    <!-- 독자후기 -->
    <div class="review-section">
      <div class="review-header">
        <h2>✍️ 독자 후기</h2>
        <button class="btn-review-write" onclick="toggleReviewForm()">후기 작성</button>
      </div>

      <!-- 후기 작성 폼 -->
      <div id="reviewForm" style="display:none;" class="review-form-box">
        <div class="form-row">
          <div class="form-group">
            <label>이름 <span class="required">*</span></label>
            <input type="text" id="reviewName" placeholder="홍길동">
          </div>
          <div class="form-group">
            <label>도서명 <span class="required">*</span></label>
            <input type="text" id="reviewBook" placeholder="읽은 책 제목">
          </div>
        </div>
        <div class="form-group">
          <label>별점</label>
          <div class="star-rating" id="starRating">
            <span onclick="setRating(1)">★</span>
            <span onclick="setRating(2)">★</span>
            <span onclick="setRating(3)">★</span>
            <span onclick="setRating(4)">★</span>
            <span onclick="setRating(5)">★</span>
          </div>
        </div>
        <div class="form-group">
          <label>후기 <span class="required">*</span></label>
          <textarea id="reviewText" rows="3" placeholder="책을 읽고 느낀 점을 자유롭게 써주세요."></textarea>
        </div>
        <div id="reviewMsg"></div>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-primary" onclick="submitReview()" id="reviewSubmitBtn">등록</button>
          <button class="btn btn-secondary" onclick="toggleReviewForm()">취소</button>
        </div>
      </div>

      <!-- 후기 목록 -->
      <div id="reviewList" class="review-list">
        <div class="loading">후기를 불러오는 중...</div>
      </div>
    </div>

    <!-- 통계 -->
    <div class="stats-row" id="statsRow">
      <div class="stat-card">
        <div class="stat-num" id="totalBooks">-</div>
        <div class="stat-label">전체 도서</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="availableBooks">-</div>
        <div class="stat-label">대출 가능</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="loanedBooks">-</div>
        <div class="stat-label">대출 중</div>
      </div>
    </div>

    <!-- 검색 -->
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="도서명, 저자, 출판사로 검색..." onkeydown="if(event.key==='Enter') searchBooks()">
      <button onclick="searchBooks()">검색</button>
    </div>

    <!-- 분류 필터 -->
    <div class="filter-bar" id="categoryFilter">
      <button class="filter-btn active" onclick="filterCategory('all', this)">전체</button>
    </div>

    <!-- 도서 목록 -->
    <div id="booksContainer">
      <div class="loading">도서 목록을 불러오는 중...</div>
    </div>
  </main>

  <footer>
    <p>서대문교회 작은도서관 (와우서재) | 문의: 교회 사무실</p>
  </footer>

  <!-- 대출 신청 모달 -->
  <div id="loanModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; overflow-y:auto;">
    <div style="background:white; max-width:480px; margin:40px auto; border-radius:12px; padding:28px; position:relative;">
      <h2 style="margin-bottom:20px; color:#3a5a3a;">📖 대출 신청</h2>
      <div id="modalBookInfo" style="background:#f8f9f8; padding:14px; border-radius:8px; margin-bottom:20px; font-size:0.9rem;"></div>
      <div class="form-section">
        <div class="form-group">
          <label>이름 <span class="required">*</span></label>
          <input type="text" id="loanName" placeholder="홍길동">
        </div>
        <div class="form-group">
          <label>연락처 <span class="required">*</span></label>
          <input type="tel" id="loanPhone" placeholder="010-0000-0000">
        </div>
        <div class="form-group">
          <label>소속 부서</label>
          <select id="loanDept">
            <option value="">선택 안함</option>
            <option>학생부</option>
            <option>주일학교</option>
            <option>청년부</option>
            <option>장년부</option>
          </select>
        </div>
      </div>
      <div id="loanMsg"></div>
      <div style="display:flex; gap:10px; margin-top:16px;">
        <button class="btn btn-primary" onclick="submitLoan()" id="loanSubmitBtn">대출 신청</button>
        <button class="btn btn-secondary" onclick="closeModal()">취소</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    loadBooks();
    loadReviews();
  </script>
</body>
</html>
